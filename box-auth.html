<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>لوحتي</title>
<style>
  html,body{margin:0;height:100%}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0b1020;color:#fff;
       font:600 22px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  a{display:none;color:#111;background:#e0b45c;padding:14px 28px;border-radius:14px;text-decoration:none}
</style>
</head>
<body>
<a id="b" rel="nofollow">ارجع للوحتي</a>
<script>
(function () {
  function get(name) {
    var q = (location.search || '').replace(/^\?/, '').split('&');
    for (var i = 0; i < q.length; i++) {
      var e = q[i].indexOf('=');
      if (e > 0 && decodeURIComponent(q[i].slice(0, e)) === name) {
        return decodeURIComponent(q[i].slice(e + 1).replace(/\+/g, '%20'));
      }
    }
    return null;
  }
  var code = get('code'), state = get('state');
  var parts = [];
  if (code != null) parts.push('code=' + encodeURIComponent(code));
  if (state != null) parts.push('state=' + encodeURIComponent(state));
  var dest = 'http://localhost:8766/box-auth?' + parts.join('&');
  var b = document.getElementById('b');
  b.href = dest;
  setTimeout(function () { b.style.display = 'inline-block'; }, 2000);
  try { location.replace(dest); } catch (e) { location.href = dest; }
})();
</script>
</body>
</html>
